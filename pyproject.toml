[project]
name = "azure_ai_architect"
version = "0.1.0"
description = ""
authors = [
    {name = "Akshara Urane",email = "aksharaurane@gmail.com"}
]
requires-python = ">=3.12,<4.0.0"
dependencies = [
    "python-dotenv (>=1.2.3,<2.0.0)",
    "openai (>=3.19.2,<4.0.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "langchain (>=1.4.2,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "langchain-openai (>=1.6.6,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "langchain-anthropic (>=1.7.4,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "langchain-huggingface (>=1.2.2,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "langchain-qdrant (>=1.1.0,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "fastembed (>=0.8.1,<0.9.0)",
    "langgraph-checkpoint-sqlite (>=3.1.1,<4.0.0)",
    "langchain-mcp-adapters (>=0.3.2,<0.4.0)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "langgraph-prebuilt (>=1.1.0,<2.0.0)"

]

[tool.poetry]
packages = [{include = "azureai_agent"}]


[tool.poetry.scripts]
azureai_agent = "azureai_agent.main:run"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
